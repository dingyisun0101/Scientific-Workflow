[package]
name = "scientific-workflow"
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
authors = ["Dingyi Sun"]
description = "Configuration-driven scientific tasks, typed state, and durable recordings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dingyisun0101/Scientific-Workflow"
documentation = "https://docs.rs/scientific-workflow"
keywords = ["science", "simulation", "workflow", "tensor", "state"]
categories = ["science", "data-structures"]
autobins = false
include = [
    "src/*.rs",
    "src/**/*.rs",
    "tests/**",
    "README.md",
    "LICENSE",
]

[dependencies]
console = "0.16.4"
crossterm = "0.29"
erased-serde = "0.4.10"
fs2 = "0.4"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
physics_in_parallel = "3.2.2"
